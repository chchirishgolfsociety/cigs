<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Play — Christchurch Irish Golf Society</title>
<meta name="description" content="Live Match Play bracket for the Christchurch Irish Golf Society.">
<link rel="icon" href="assets/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="race-hero">
    <div class="container hero-with-photo">
      <div>
        <p class="eyebrow">2026 Season</p>
        <h1>Match Play</h1>
        <p>Our annual knockout competition, run alongside the Race across the same events — win your match, advance to the next round.</p>
      </div>
      <figure class="winner-photo">
        <img src="assets/2025_matchplay.jpg" alt="Martin Kinsella receiving the 2025 Match Play trophy">
        <figcaption>
          <span class="cap-label">2025 Match Play Winner</span>
          <span class="cap-name">Martin Kinsella</span>
        </figcaption>
      </figure>
    </div>
  </section>

  <section style="padding-top:28px">
    <div class="container">
      <p class="race-status" id="matchplay-status">Loading bracket…</p>

      <div class="bracket-desktop" id="bracket-desktop"></div>

      <div class="bracket-mobile" id="bracket-mobile">
        <div class="bracket-mobile-tabs" id="bracket-mobile-tabs"></div>
        <div class="bracket-mobile-track" id="bracket-mobile-track"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/sheet.js"></script>
<script src="js/matchplay.js"></script>
</body>
</html>
