<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — Christchurch Irish Golf Society</title>
<meta name="description" content="2026 event calendar for the Christchurch Irish Golf Society.">
<link rel="icon" href="assets/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="race-hero">
    <div class="container">
      <p class="eyebrow">2026 Season</p>
      <h1>Events</h1>
      <p>One round a month, right around Canterbury. Every event feeds into the Race to Hanmer leaderboard.</p>
    </div>
  </section>

  <section style="padding-top:28px">
    <div class="container">
      <p class="race-status" id="events-status">Loading events…</p>
      <ul class="events-list" id="events-list" style="list-style:none;margin:0;padding:0"></ul>

      <div class="card" style="margin-top:28px">
        <p class="eyebrow">RSVPs &amp; details</p>
        <p style="margin-bottom:14px">Full event details, tee times, and RSVPs are posted on our Facebook page ahead of each round.</p>
        <a class="btn btn-outline" href="https://www.facebook.com/" target="_blank" rel="noopener">See events on Facebook</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/sheet.js"></script>
<script src="js/events.js"></script>
</body>
</html>
