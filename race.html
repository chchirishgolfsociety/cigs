<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race to Hanmer — Christchurch Irish Golf Society</title>
<meta name="description" content="Live leaderboard for the Christchurch Irish Golf Society's 2026 Race to Hanmer.">
<link rel="icon" href="assets/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="race-hero">
    <div class="container">
      <p class="eyebrow">2026 Season</p>
      <h1>Race to Hanmer</h1>
      <p>Best six event scores across the season, plus your score at Hanmer Springs in November, decide the winner.</p>
      <p class="race-sponsor-line">Kindly sponsored by Cook Costello.</p>
    </div>
  </section>

  <section style="padding-top:28px">
    <div class="container">
      <div class="race-controls">
        <input type="search" id="race-search" placeholder="Find a player…" aria-label="Search players">
      </div>
      <p class="race-status" id="race-status">Loading leaderboard…</p>
      <div class="legend" id="race-legend"></div>

      <div class="leaderboard-table-wrap" id="leaderboard"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/sheet.js"></script>
<script src="js/race.js"></script>
</body>
</html>
