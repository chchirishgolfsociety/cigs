<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cook Costello Race to Hanmer — Christchurch Irish Golf Society</title>
<meta name="description" content="Live leaderboard for the Christchurch Irish Golf Society's 2026 Race to Hanmer.">
<link rel="icon" href="assets/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="race-hero">
    <div class="container">
      <p class="eyebrow">2026 Season</p>
      <h1>Cook Costello Race to Hanmer</h1>
      <p>Best six event scores across the season, plus your score at Hanmer Springs in November, decide the winner.</p>
      <p class="race-sponsor-line">Kindly sponsored by Cook Costello.</p>
    </div>
  </section>

  <section style="padding-top:28px">
    <div class="container-wide">
      <p class="race-status" id="race-status">Loading leaderboard…</p>
      <div class="legend" id="race-legend"></div>

      <p class="rotate-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="9" height="15" rx="1.5"/>
          <path d="M19 8.5a6.5 6.5 0 0 1-9.5 6"/>
          <path d="M19 8.5l-2.8-.6M19 8.5l-1 2.6"/>
        </svg>
        Rotate device to see event results
      </p>

      <div class="leaderboard-table-wrap" id="leaderboard"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/sheet.js"></script>
<script src="js/race.js"></script>
</body>
</html>
